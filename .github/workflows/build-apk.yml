name: Build Restaurant APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: restaurant-app-main
        run: flutter pub get

      - name: Build Android APK
        working-directory: restaurant-app-main
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee ../analyze_log.txt || true
          flutter build apk --release --android-skip-build-dependency-validation --dart-define=API_BASE_URL=https://restaurent-2-xq6f.onrender.com/api/v1 2>&1 | tee ../build_log.txt

      - name: Capture Failure Log
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-failure-log
          { echo "=== ANALYZE LOG ==="; tail -n 100 analyze_log.txt 2>/dev/null; echo "=== BUILD LOG ==="; tail -n 150 build_log.txt 2>/dev/null; } > build_error_summary.txt
          git add build_error_summary.txt
          git commit -m "ci: capture build error log" || true
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" build-failure-log --force || true

      - name: Upload Failure Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            analyze_log.txt
            build_log.txt

      - name: Rename APK for Easy Download
        run: |
          APK_PATH=$(find restaurant-app-main/build -name "*release*.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find restaurant-app-main/build -name "*.apk" 2>/dev/null | head -n 1)
          fi
          if [ -n "$APK_PATH" ]; then
            echo "Found APK at: $APK_PATH"
            cp "$APK_PATH" ./restaurant-app.apk
          else
            echo "Using default fallback"
            cp restaurant-app-main/build/app/outputs/flutter-apk/app-release.apk ./restaurant-app.apk
          fi

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: restaurant-app-release
          path: ./restaurant-app.apk
          if-no-files-found: error

      - name: Publish Public GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.0
          name: "Restaurant OS v1.0.0 (Release APK)"
          body: |
            ### 📱 Restaurant Mobile Application (Android)
            
            Sabhi users direct niche diye gaye APK link par tap karke download aur install kar sakte hain:
            - **Direct Download APK:** [`restaurant-app.apk`](https://github.com/ashish1332005/Restaurent/releases/download/v1.0.0/restaurant-app.apk)
            
            #### 🚀 Naye Features & Updates:
            - 💳 **Online Payment Gateway Integrated:** Live Dynamic UPI QR, Google Pay, PhonePe, Paytm, Cards & NetBanking.
            - ⚡ **Instant Restaurant Activation:** Free 30-day trial automatically active. No waiting or "request activation" blocker.
            - 🛒 **Customer Order Checkout:** Instant UPI QR Pay vs Pay at Counter options with live animated bill summary & celebration particles.
            - 🍽️ **Smart Table QR Ordering & Live Menu:** Bestsellers, Chef Specials, Category chips and real-time order tracking.
            - 📊 **Royal Admin Dashboard:** POS, Kitchen KDS, Floor tables, Inventory, Attendance and instant online plan upgrade.
          files: ./restaurant-app.apk
