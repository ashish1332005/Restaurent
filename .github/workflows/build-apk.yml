name: Build Restaurant APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: restaurant-app-main
        run: flutter pub get

      - name: Build Android APK
        working-directory: restaurant-app-main
        run: |
          flutter build apk --release --verbose > build_log.txt 2>&1 || (echo "=== BUILD ERROR TAIL ===" && tail -n 150 build_log.txt && exit 1)

      - name: Rename APK for Easy Download
        run: |
          cp restaurant-app-main/build/app/outputs/flutter-apk/app-release.apk ./restaurant-app.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: restaurant-app-release
          path: ./restaurant-app.apk
          if-no-files-found: error

      - name: Publish Public GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.0
          name: "Restaurant OS v1.0.0 (Release APK)"
          body: |
            ### 📱 Restaurant Mobile Application (Android)
            
            Sabhi users direct niche diye gaye APK link par tap karke download aur install kar sakte hain:
            - **Download APK:** [`restaurant-app.apk`](https://github.com/ashish1332005/Restaurent/releases/download/v1.0.0/restaurant-app.apk)
            
            #### Features Included:
            - 🍽️ Customer Table QR Ordering & Live Menu
            - 🔥 Bestsellers & Chef Specials Highlights
            - 🪙 Loyalty Coins & Tier Perks
            - ⏱️ Live Kitchen Order Status Stepper
            - 📱 1-Tap WhatsApp GST Bill Dispatch
            - ⭐ 5-Star Delight Feedback & Google Review Booster
          files: ./restaurant-app.apk
